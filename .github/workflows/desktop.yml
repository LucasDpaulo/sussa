name: Desktop packages
# Cada push em main testa, empacota e publica uma release.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/"$GITHUB_REPOSITORY"/releases --paginate --jq '.[].tag_name' > /tmp/sussa-tags
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = JSON.parse(fs.readFileSync('package.json')).version;
          const versions = [base, ...fs.readFileSync('/tmp/sussa-tags', 'utf8').trim().split(/\s+/).map(t => t.replace(/^v/, ''))]
            .filter(v => /^\d+\.\d+\.\d+$/.test(v))
            .sort((a,b) => { const x=a.split('.').map(Number), y=b.split('.').map(Number); return x[0]-y[0] || x[1]-y[1] || x[2]-y[2]; });
          const [major, minor, patch] = versions.at(-1).split('.').map(Number);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'number='+[major,minor,patch+1].join('.')+'\n');
          NODE
  package:
    needs: version
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Definir versão dos pacotes
        if: needs.version.result == 'success'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version
      - run: npm ci
      - run: npm test
      - name: Desktop smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - name: Desktop smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: YouTube catalog smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:youtube -- --no-sandbox
      - name: YouTube catalog smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:youtube

      - if: needs.version.result == 'success' && runner.os == 'Linux'
        run: npm run pack:linux
      - if: needs.version.result == 'success' && runner.os == 'Windows'
        run: npm run pack:windows
      - uses: actions/upload-artifact@v4
        if: needs.version.result == 'success'
        with:
          name: desktop-${{ runner.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe

  release:
    needs: [version, package]
    if: needs.version.result == 'success' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --generate-notes --latest
