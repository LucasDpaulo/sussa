name: Desktop packages
# - Rodar manualmente (workflow_dispatch): só gera os pacotes como artefatos, sem release.
# - Enviar uma tag vX.Y.Z: gera os pacotes e cria uma release em RASCUNHO (só quem tem acesso
#   ao repositório vê). Revise e publique pelo GitHub ou com: gh release edit vX.Y.Z --draft=false
# - Tags com sufixo (vX.Y.Z-beta.1, -rc.1...) viram pre-release ao publicar: o install.sh/install.ps1
#   padrão ignoram pre-releases e rascunhos, então ninguém recebe uma versão de teste sem pedir.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag e package.json com a mesma versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($expected)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Desktop smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - name: Desktop smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: YouTube catalog smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:youtube -- --no-sandbox
      - name: YouTube catalog smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:youtube
      - if: runner.os == 'Linux'
        run: npm run pack:linux
      - if: runner.os == 'Windows'
        run: npm run pack:windows
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Criar release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--draft --generate-notes --title $TAG"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" $flags
