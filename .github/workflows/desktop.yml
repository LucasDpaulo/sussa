name: Desktop checks
# Distribuição pelo código: valida Linux e Windows sem gerar instaladores ou releases.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag e package.json com a mesma versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão do package.json ($expected)."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Desktop smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - name: Desktop smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: YouTube catalog smoke (Linux CI)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:youtube -- --no-sandbox
      - name: YouTube catalog smoke (Windows)
        if: runner.os == 'Windows'
        run: npm run test:youtube
